<main id="scene" role="img" aria-label="黑色夜空和零星的冷白星点映衬下，清晰的粉红水晶粒子从下往上汇成圣诞树，金色流光螺旋环绕，右下角的金色流星绕树升起，树顶半透明金色玛瑙星点亮，星尘缓缓闪烁。">

<script>
(()=>{'use strict';

const pinks=[[1,.12,.55],[1,.32,.76],[1,.72,.90],[.94,.06,.42]];
function radius(y){return 1.075*Math.pow(Math.max(.006,1-y/3.8),.84);}
// Layered branches carry separated crystal points; depth stays visibly darker.
for(let tier=0;tier<8;tier++){
 const base=.12+tier*.43,height=.80-tier*.026,wide=1.06*Math.pow(1-base/3.9,.84),count=Math.floor(1650*(1-tier*.075));
 for(let j=0;j<count;j++){
  const f=Math.pow(rnd(),1.16),branch=Math.floor(rnd()*36),a=branch/36*TAU+(rnd()-.5)*.15+tier*.11;
  const shell=rnd()<.73?.84+rnd()*.16:.28+rnd()*.54;
  const r=wide*Math.pow(1-f,.82)*shell*(1+.045*Math.sin(a*18+tier)),y=base+height*f+(rnd()-.5)*.021+Math.sin(a*8+tier)*.019*(1-f);
  const pick=rnd(),c=pinks[pick<.54?0:pick<.84?1:pick<.94?2:3],size=.76+Math.pow(rnd(),2.1)*.82;
  add(Math.cos(a)*r,y,Math.sin(a)*r,...c,size,rnd(),0,y/3.75+Math.sin(a*3)*.008);
 }
 // A delicate, scalloped rim makes each branch tier distinct.
 for(let j=0;j<145;j++){
  const a=j/145*TAU,r=wide*(.93+.045*Math.sin(a*18+tier)),y=base+.025+Math.sin(a*8+tier)*.019;
  add(Math.cos(a)*r,y,Math.sin(a)*r,1,.52,.78,.95+rnd()*.55,rnd(),0,y/3.75);
 }
}
// Two fine gold strands; bright comets move along the main path.
for(let i=0;i<1900;i++){
 const h=i/1899,y=.14+h*3.52,a=h*TAU*4.65+.35,r=radius(y)+.035+(rnd()-.5)*.012;

}
for(let i=0;i<520;i++){

}
for(let i=0;i<980;i++){

}

const vertex=`
attribute vec3 aPosition,aColor;attribute vec4 aMeta;
uniform float uTime,uFill,uAspect,uScale,uAngle,uTilt,uDpr,uHeight;
varying vec3 vColor;varying float vAlpha,vKind,vTwinkle;

 }

const fragment=`

void main(){

function render(dt=0){const normalized=Math.max(0,Math.min(1,(elapsed-.15)/4.0)),fill=1.12*(1-Math.pow(1-normalized,1.12));if(gl){gl.clear(gl.COLOR_BUFFER_BIT);const values={Time:time,Fill:fill,Aspect:W/H,Scale:scale,Angle:angle,Tilt:tilt,Dpr:dpr,Height:H};for(const k in values)gl.uniform1f(uniforms[k],values[k]);gl.drawArrays(gl.POINTS,0,pos.length/3);}else drawCPU(fill);ink.clearRect(0,0,W,H);drawFloor();drawRibbons(fill);drawMeteor();drawImpact(false);drawStar(fill);drawImpact(true);if(!celebrated&&fill>1.085){celebrated=true;const p=project(0,3.91);burst(p.x,p.y,.42);}drawBursts(dt);}
function frame(stamp){raf=0;if(document.hidden)return;const dt=last?(stamp-last)/1000:0;last=stamp;time+=dt;elapsed+=dt;targetAngle+=dt*.052;angle+=(targetAngle-angle)*Math.min(1,dt*4.5);tilt+=(targetTilt-tilt)*Math.min(1,dt*3);render(dt);raf=requestAnimationFrame(frame);}
new ResizeObserver(resize).observe(scene);resize();if(!reduced)raf=requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;}else if(!raf&&!reduced)raf=requestAnimationFrame(frame);});
let pointer=null;scene.addEventListener('pointerdown',e=>{pointer={id:e.pointerId,x:e.clientX,y:e.clientY,moved:0};scene.setPointerCapture(e.pointerId);});
scene.addEventListener('pointermove',e=>{if(!pointer)return;if(pointer.id!==e.pointerId)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;pointer.moved+=Math.abs(dx)+Math.abs(dy);targetAngle+=dx*.008;targetTilt=Math.max(-.16,Math.min(.07,targetTilt+dy*.0003));pointer.x=e.clientX;pointer.y=e.clientY;if(reduced){angle=targetAngle;tilt=targetTilt;render();}});
scene.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;if(pointer.moved<9){const r=scene.getBoundingClientRect();burst(e.clientX-r.left,e.clientY-r.top,.8);}pointer=null;});scene.addEventListener('pointercancel',()=>pointer=null);
if(gl)canvas.addEventListener('webglcontextlost',e=>{
 e.preventDefault();if(e.currentTarget!==canvas||!gl)return;
 if(raf)cancelAnimationFrame(raf);raf=0;
 const fresh=canvas.cloneNode(),context=fresh.getContext('2d');if(!context)return;
 canvas.replaceWith(fresh);canvas=fresh;cpu=context;gl=null;
 initializeSprites();last=0;resize();if(!reduced)render();
 if(!reduced&&!document.hidden)raf=requestAnimationFrame(frame);
});
})();
</script>
